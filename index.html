<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notatki</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #677084;
    --border: #d9dde5;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --danger: #c63b3b;
    --ok: #1f8a4c;
    --focus: rgba(47, 111, 222, .25);
    --radius: 10px;
  }
  :root[data-theme="dark"] {
    --bg: #15181e;
    --card: #1e222a;
    --text: #e6e8ee;
    --muted: #9aa2b2;
    --border: #343a46;
    --accent: #5b8ff0;
    --accent-text: #0e1320;
    --danger: #ef6a6a;
    --ok: #4cc27f;
    --focus: rgba(91, 143, 240, .3);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-theme="auto"] {
      --bg: #15181e;
      --card: #1e222a;
      --text: #e6e8ee;
      --muted: #9aa2b2;
      --border: #343a46;
      --accent: #5b8ff0;
      --accent-text: #0e1320;
      --danger: #ef6a6a;
      --ok: #4cc27f;
      --focus: rgba(91, 143, 240, .3);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 12px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  label { display: block; font-weight: 600; font-size: .92rem; margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 140px; resize: vertical; }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
  }
  .invalid { border-color: var(--danger) !important; }
  .err { color: var(--danger); font-size: .85rem; margin-top: 4px; min-height: 0; }
  .counter { color: var(--muted); font-size: .8rem; text-align: right; margin-top: 4px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .primary { background: var(--accent); color: var(--accent-text); }
  .primary:hover { filter: brightness(1.07); }
  .ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .ghost:hover { border-color: var(--muted); }
  .status { font-size: .9rem; color: var(--ok); }

  .notice {
    background: var(--card);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: .88rem;
    margin-bottom: 14px;
  }

  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .note {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .note.editing { border-color: var(--accent); }
  .note-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .note-name { font-weight: 700; overflow-wrap: anywhere; }
  .note-date { color: var(--muted); font-size: .8rem; }
  .note-text { margin: 8px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note-actions { display: flex; gap: 8px; }
  .small { padding: 5px 10px; font-size: .85rem; font-weight: 500; }
  .danger { background: transparent; color: var(--danger); border-color: var(--border); }
  .danger:hover { border-color: var(--danger); }
  .empty { color: var(--muted); font-size: .92rem; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Twoje notatki</h1>
  <p class="sub">Notatki zapisują się tylko w tej przeglądarce i nie są nigdzie wysyłane.</p>

  <div id="storageNotice" class="notice" hidden>
    Twoja przeglądarka blokuje zapisywanie danych na tej stronie — notatki znikną po jej zamknięciu.
  </div>

  <form id="form" class="card" novalidate>
    <div class="field">
      <label for="name">Imię</label>
      <input id="name" name="name" type="text" maxlength="80" autocomplete="given-name" placeholder="Wpisz swoje imię">
      <div id="nameErr" class="err" aria-live="polite"></div>
    </div>
    <div class="field">
      <label for="text">Notatki</label>
      <textarea id="text" name="text" maxlength="5000" placeholder="Napisz tutaj swoje notatki…"></textarea>
      <div id="textErr" class="err" aria-live="polite"></div>
      <div id="counter" class="counter">0 / 5000</div>
    </div>
    <div class="actions">
      <button type="submit" id="saveBtn" class="primary">Zapisz notatkę</button>
      <button type="button" id="clearBtn" class="ghost">Wyczyść</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </form>

  <h2>Zapisane notatki <span id="count" class="note-date"></span></h2>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty">Nie masz jeszcze żadnych notatek.</p>
</div>

<script>
(function () {
  // Motyw: ?theme=light (domyślnie) | dark | auto
  var theme = new URLSearchParams(location.search).get("theme");
  document.documentElement.setAttribute("data-theme",
    theme === "dark" || theme === "auto" ? theme : "light");

  var KEY = "notatki.v1";
  var NAME_KEY = "notatki.lastName";
  var DRAFT_KEY = "notatki.draft";

  // Bezpieczny dostęp do localStorage (w iframe bywa zablokowany)
  var memory = {};
  var storageOk = true;
  function sGet(k) {
    try { return localStorage.getItem(k); } catch (e) { storageOk = false; return memory[k] ?? null; }
  }
  function sSet(k, v) {
    try { localStorage.setItem(k, v); } catch (e) { storageOk = false; memory[k] = v; showNotice(); }
  }
  function sDel(k) {
    try { localStorage.removeItem(k); } catch (e) { delete memory[k]; }
  }
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { storageOk = false; }

  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), nameEl = $("name"), textEl = $("text");
  var saveBtn = $("saveBtn"), clearBtn = $("clearBtn"), statusEl = $("status");
  var listEl = $("list"), emptyEl = $("empty"), countEl = $("count"), counterEl = $("counter");

  function showNotice() { $("storageNotice").hidden = false; }
  if (!storageOk) showNotice();

  function load() {
    try { var d = JSON.parse(sGet(KEY) || "[]"); return Array.isArray(d) ? d : []; }
    catch (e) { return []; }
  }
  function save(notes) { sSet(KEY, JSON.stringify(notes)); }

  var notes = load();
  var editingId = null;

  var fmt = new Intl.DateTimeFormat("pl-PL", { dateStyle: "medium", timeStyle: "short" });

  function render() {
    listEl.textContent = "";
    var sorted = notes.slice().sort(function (a, b) { return b.updated - a.updated; });
    sorted.forEach(function (n) {
      var li = document.createElement("li");
      li.className = "note" + (n.id === editingId ? " editing" : "");

      var head = document.createElement("div");
      head.className = "note-head";
      var nm = document.createElement("span");
      nm.className = "note-name";
      nm.textContent = n.name;
      var dt = document.createElement("span");
      dt.className = "note-date";
      dt.textContent = (n.updated !== n.created ? "edytowano " : "") + fmt.format(new Date(n.updated));
      head.append(nm, dt);

      var tx = document.createElement("p");
      tx.className = "note-text";
      tx.textContent = n.text;

      var act = document.createElement("div");
      act.className = "note-actions";
      var ed = document.createElement("button");
      ed.type = "button";
      ed.className = "ghost small";
      ed.textContent = "Edytuj";
      ed.addEventListener("click", function () { startEdit(n.id); });
      var del = document.createElement("button");
      del.type = "button";
      del.className = "danger small";
      del.textContent = "Usuń";
      del.addEventListener("click", function () { remove(n.id); });
      act.append(ed, del);

      li.append(head, tx, act);
      listEl.appendChild(li);
    });
    emptyEl.hidden = notes.length > 0;
    countEl.textContent = notes.length ? "(" + notes.length + ")" : "";
  }

  function updateCounter() { counterEl.textContent = textEl.value.length + " / 5000"; }

  function flash(msg) {
    statusEl.textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { statusEl.textContent = ""; }, 2500);
  }

  function setErr(el, errId, msg) {
    $(errId).textContent = msg || "";
    el.classList.toggle("invalid", !!msg);
  }

  function resetForm(keepName) {
    textEl.value = "";
    if (!keepName) nameEl.value = "";
    editingId = null;
    saveBtn.textContent = "Zapisz notatkę";
    clearBtn.textContent = "Wyczyść";
    setErr(nameEl, "nameErr"); setErr(textEl, "textErr");
    sDel(DRAFT_KEY);
    updateCounter();
  }

  function startEdit(id) {
    var n = notes.find(function (x) { return x.id === id; });
    if (!n) return;
    editingId = id;
    nameEl.value = n.name;
    textEl.value = n.text;
    saveBtn.textContent = "Zapisz zmiany";
    clearBtn.textContent = "Anuluj";
    updateCounter();
    render();
    textEl.focus();
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function remove(id) {
    if (!confirm("Usunąć tę notatkę?")) return;
    notes = notes.filter(function (x) { return x.id !== id; });
    save(notes);
    if (editingId === id) resetForm(true);
    render();
    flash("Usunięto.");
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameEl.value.trim();
    var text = textEl.value.trim();
    setErr(nameEl, "nameErr", name ? "" : "Podaj imię.");
    setErr(textEl, "textErr", text ? "" : "Notatka nie może być pusta.");
    if (!name) { nameEl.focus(); return; }
    if (!text) { textEl.focus(); return; }

    var now = Date.now();
    if (editingId) {
      notes = notes.map(function (x) {
        return x.id === editingId ? { id: x.id, name: name, text: text, created: x.created, updated: now } : x;
      });
      flash("Zapisano zmiany.");
    } else {
      notes.push({ id: now.toString(36) + Math.random().toString(36).slice(2, 7), name: name, text: text, created: now, updated: now });
      flash("Zapisano!");
    }
    save(notes);
    sSet(NAME_KEY, name);
    resetForm(true);
    render();
  });

  clearBtn.addEventListener("click", function () {
    var wasEditing = !!editingId;
    resetForm(wasEditing);
    render();
    textEl.focus();
  });

  nameEl.addEventListener("input", function () { if (nameEl.value.trim()) setErr(nameEl, "nameErr"); });
  textEl.addEventListener("input", function () {
    if (textEl.value.trim()) setErr(textEl, "textErr");
    updateCounter();
    if (!editingId) sSet(DRAFT_KEY, textEl.value);
  });

  // Przywróć imię i niezapisany szkic
  nameEl.value = sGet(NAME_KEY) || "";
  textEl.value = sGet(DRAFT_KEY) || "";
  updateCounter();
  render();
})();
</script>
</body>
</html>
